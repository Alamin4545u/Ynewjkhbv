<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Ad</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 40px 16px; }
  button { padding: 12px 28px; font-size: 18px; border: 0; border-radius: 8px;
           background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { background: #94a3b8; cursor: default; }
  #status { margin-top: 20px; color: #555; }
</style>

<!-- আপনার অ্যাড SDK -->
<script src='//libtl.com/sdk.js' data-zone='12308086' data-sdk='show_12308086'></script>
</head>
<body>

<button id="showBtn">Show Ad</button>
<p id="status"></p>

<script>
  const btn = document.getElementById('showBtn');
  const statusEl = document.getElementById('status');
  let started = false;

  const rand = (min, max) => Math.random() * (max - min) + min;

  function showAd() {
    const fn = window['show_12308086'];
    if (typeof fn !== 'function') {
      statusEl.textContent = 'SDK লোড হয়নি, ৩ সেকেন্ড পর আবার চেষ্টা হবে...';
      setTimeout(showAd, 3000);
      return;
    }
    statusEl.textContent = 'অ্যাড চলছে...';
    Promise.resolve(fn())
      .catch(() => {})            // অ্যাড না পেলেও লুপ চলবে
      .finally(scheduleNext);     // অ্যাড বন্ধ হলে পরেরটার জন্য অপেক্ষা
  }

  function scheduleNext() {
    const wait = rand(2, 4) * 1000;   // ২–৪ সেকেন্ড পর আবার
    statusEl.textContent = 'পরের অ্যাড আসছে...';
    setTimeout(showAd, wait);
  }

  btn.addEventListener('click', () => {
    if (started) return;              // একবার ক্লিকেই চালু
    started = true;
    btn.disabled = true;
    showAd();
  });
</script>
</body>
</html>
