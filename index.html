<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Monetag Ads Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>📢 Ads Mini App</h1>
      <p id="user" class="muted"></p>
    </header>

    <section class="card">
      <div class="row"><span>বর্তমান Zone ID</span><b id="zoneLabel">সেট করা নেই</b></div>
      <div class="row"><span>পয়েন্ট</span><b id="points">0</b></div>
    </section>

    <section class="card">
      <h2>অ্যাড দেখুন</h2>
      <button id="btnInter" class="btn">▶️ Rewarded Interstitial</button>
      <button id="btnPop" class="btn alt">🪟 Rewarded Popup</button>
      <button id="btnInApp" class="btn alt">🔁 In-App Interstitial চালু করুন</button>
      <p id="status" class="muted"></p>
    </section>

    <section class="card" id="settings">
      <h2>⚙️ Settings</h2>
      <label for="zoneInput">Monetag Zone ID</label>
      <input id="zoneInput" type="text" inputmode="numeric" placeholder="যেমন: 1234567">
      <div class="two">
        <button id="btnSave" class="btn">সেভ করুন</button>
        <button id="btnClear" class="btn danger">মুছুন</button>
      </div>
    </section>
  </main>
  <div id="toast"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
