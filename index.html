<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>বাংলা আর্ন</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://ads.bengalads.com/sdk/telegram-interstitial.js"></script>
<style>
:root{--bg:#0b1f1a;--card:#12332a;--acc:#10b981;--acc2:#fbbf24;--tx:#ecfdf5;--mut:#86b8a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;padding-bottom:76px}
.top{padding:18px 16px;background:linear-gradient(135deg,#065f46,#10b981);border-radius:0 0 24px 24px}
.top small{opacity:.85}.bal{font-size:34px;font-weight:800;margin:4px 0}.top .bdt{color:#fef3c7}
.p{display:none;padding:14px}.p.on{display:block}
.c{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.c h3{margin:0 0 8px;font-size:16px}
button{border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;background:var(--acc);color:#04261c;width:100%}
button:disabled{opacity:.45}.g{background:var(--acc2)}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2f6b58;background:#0b1f1a;color:var(--tx);font-size:15px;margin-bottom:8px}
#tap{width:200px;height:200px;border-radius:50%;margin:10px auto;display:block;font-size:44px;background:radial-gradient(circle at 30% 30%,#fde68a,#f59e0b);box-shadow:0 8px 30px #f59e0b55;transition:transform .08s}
#tap:active{transform:scale(.93)}
.bar{height:10px;background:#0b1f1a;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.row button{width:auto;padding:9px 14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0d2a22;border-top:1px solid #1f5a49}
nav button{background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}nav button.on{color:var(--acc2)}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:20px;display:none;z-index:9;font-size:14px}
.mut{color:var(--mut);font-size:13px}
</style></head><body>
<div id="toast"></div>
<div class="top"><small id="hi">স্বাগতম</small><div class="bal"><span id="coins">0</span> 🪙</div><div class="bdt" id="bdt">≈ ৳0.00</div></div>

<section class="p on" id="p-earn">
 <div class="c"><h3>🎮 ট্যাপ গেম</h3><div class="mut">প্রতি ট্যাপে কয়েন! এনার্জি শেষ হলে অপেক্ষা করুন।</div>
  <button id="tap">🪙</button><div class="bar"><i id="en"></i></div><div class="mut" id="enT"></div></div>
 <div class="c"><h3>🎡 লাকি স্পিন</h3><button id="spin">স্পিন করুন</button><div class="mut" id="spinT"></div></div>
 <div class="c"><h3>🎁 দৈনিক বোনাস</h3><button id="daily" class="g">বোনাস নিন</button><div class="mut" id="dailyT"></div></div>
 <div class="c"><h3>📺 বিজ্ঞাপন দেখে বোনাস</h3><button id="adBtn" class="g">অ্যাড দেখুন ও কয়েন পান</button></div>
</section>

<section class="p" id="p-task"><div class="c"><h3>✅ টাস্ক</h3><div id="tasks" class="mut">লোড হচ্ছে...</div></div></section>

<section class="p" id="p-wal">
 <div class="c"><h3>💸 উইথড্র</h3>
  <div class="mut" id="wInfo"></div>
  <select id="wm"><option>bKash</option><option>Nagad</option><option>Rocket</option></select>
  <input id="wn" type="tel" placeholder="নম্বর (01XXXXXXXXX)"><input id="wa" type="number" placeholder="কয়েন সংখ্যা">
  <button id="wBtn">রিকোয়েস্ট পাঠান</button></div>
 <div class="c"><h3>🧾 হিস্ট্রি</h3><div id="hist" class="mut">—</div></div>
</section>

<nav><button class="on" data-t="earn">🎮 আয়</button><button data-t="task">✅ টাস্ক</button><button data-t="wal">💸 ওয়ালেট</button></nav>

<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,increment,serverTimestamp,arrayUnion,collection,addDoc,query,where,getDocs,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id), tg=window.Telegram?.WebApp; tg?.ready();tg?.expand();
const toast=t=>{const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2500)};
const bn=n=>Number(n).toLocaleString("bn-BD");
let cfg={adEvery:3,tapReward:1,dailyBonus:50,spinPrizes:[5,10,20,50],minWithdraw:1000,rate:100,tasks:[]},U={coins:0,doneTasks:[]},uid,actions=0,adKey="",pend=0,energy=50;
const tu=tg?.initDataUnsafe?.user||{id:0,first_name:"গেস্ট"};
$("hi").textContent="স্বাগতম, "+tu.first_name;

// ---- navigation ----
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button,.p").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("p-"+b.dataset.t).classList.add("on");if(b.dataset.t=="wal")loadHist()});

// ---- Firebase ----
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
await signInAnonymously(auth);uid=auth.currentUser.uid;
const uref=doc(db,"users",uid);
if(!(await getDoc(uref)).exists())await setDoc(uref,{tgId:tu.id,name:tu.first_name,coins:0,doneTasks:[],lastDaily:0,lastSpin:0,lastWrite:serverTimestamp()});
onSnapshot(doc(db,"config","main"),s=>{if(s.exists())cfg={...cfg,...s.data()};render()});
onSnapshot(uref,s=>{U=s.data();render()});

// ---- BengalAds ----
async function showAd(){
 if(!cfg.appId||!cfg.formatId||typeof BengalAds==="undefined")return"no_config";
 try{const k=cfg.appId+cfg.formatId;if(k!==adKey){BengalAds.init({appId:cfg.appId,formatId:cfg.formatId});adKey=k}
  return (await BengalAds.showInterstitial()).status}catch(e){return"error"}}
async function maybeAd(){actions++;if(cfg.adEvery>0&&actions%cfg.adEvery===0)await showAd()}

// ---- coins ----
async function add(n){await updateDoc(uref,{coins:increment(n),lastWrite:serverTimestamp()})}
function render(){
 $("coins").textContent=bn(U.coins);$("bdt").textContent="≈ ৳"+(U.coins/cfg.rate).toFixed(2);
 $("wInfo").textContent=`ন্যূনতম ${bn(cfg.minWithdraw)} কয়েন • ${bn(cfg.rate)} কয়েন = ৳১`;
 const l=$("tasks");l.innerHTML=cfg.tasks?.length?"":"এখন কোনো টাস্ক নেই।";
 (cfg.tasks||[]).forEach(t=>{const done=U.doneTasks?.includes(t.id),r=document.createElement("div");r.className="row";
  r.innerHTML=`<div>${t.title}<br><span class="mut">+${bn(t.reward)} 🪙</span></div>`;const b=document.createElement("button");
  b.textContent=done?"সম্পন্ন":"শুরু";b.disabled=done;b.onclick=()=>{tg?.openLink?tg.openLink(t.url):window.open(t.url);b.disabled=true;let s=8;const i=setInterval(async()=>{b.textContent=--s+"s";if(s<=0){clearInterval(i);b.textContent="ক্লেইম";b.disabled=false;b.onclick=async()=>{b.disabled=true;await updateDoc(uref,{coins:increment(t.reward),doneTasks:arrayUnion(t.id),lastWrite:serverTimestamp()});toast("+"+t.reward+" 🪙");maybeAd()}}},1000)};
  r.appendChild(b);l.appendChild(r)});
 cool("daily","lastDaily",864e5,"dailyT");cool("spin","lastSpin",216e5,"spinT");
}
function cool(btn,key,ms,txt){const left=(U[key]||0)+ms-Date.now();$(btn).disabled=left>0;$(txt).textContent=left>0?"পরবর্তী: "+Math.ceil(left/36e5)+" ঘণ্টা পরে":""}

// ---- tap game ----
$("tap").onclick=()=>{if(energy<1)return;energy--;pend+=cfg.tapReward;U.coins+=cfg.tapReward;render();tg?.HapticFeedback?.impactOccurred("light");
 clearTimeout(window._f);window._f=setTimeout(flush,3000);if(pend>=cfg.tapReward*20)flush()};
async function flush(){if(!pend)return;const n=Math.min(pend,500);pend-=n;try{await add(n);maybeAd()}catch(e){}}
setInterval(()=>{energy=Math.min(50,energy+1);$("en").style.width=energy*2+"%";$("enT").textContent="এনার্জি: "+energy+"/50"},1000);

$("spin").onclick=async()=>{const p=cfg.spinPrizes[Math.floor(Math.random()*cfg.spinPrizes.length)];
 await updateDoc(uref,{coins:increment(p),lastSpin:Date.now(),lastWrite:serverTimestamp()});toast("🎉 +"+p+" কয়েন");maybeAd()};
$("daily").onclick=async()=>{await updateDoc(uref,{coins:increment(cfg.dailyBonus),lastDaily:Date.now(),lastWrite:serverTimestamp()});toast("🎁 +"+cfg.dailyBonus);maybeAd()};
$("adBtn").onclick=async()=>{const s=await showAd();if(s==="closed"){await add(cfg.tapReward*10);toast("+"+cfg.tapReward*10+" 🪙")}else toast(s==="no_fill"?"এখন কোনো অ্যাড নেই":s==="bot_daily_cap"?"আজকের অ্যাড লিমিট শেষ":"অ্যাড দেখানো যায়নি")};

// ---- withdraw ----
$("wBtn").onclick=async()=>{const a=parseInt($("wa").value),n=$("wn").value.trim();
 if(!/^01\d{9}$/.test(n))return toast("সঠিক নম্বর দিন");if(!(a>=cfg.minWithdraw))return toast("ন্যূনতম "+cfg.minWithdraw+" কয়েন");if(a>U.coins)return toast("পর্যাপ্ত ব্যালেন্স নেই");
 const b=writeBatch(db);b.set(doc(collection(db,"withdrawals")),{uid,tgId:tu.id,name:tu.first_name,method:$("wm").value,number:n,coins:a,taka:+(a/cfg.rate).toFixed(2),status:"pending",createdAt:Date.now()});
 b.update(uref,{coins:increment(-a),lastWrite:serverTimestamp()});
 try{await b.commit();toast("রিকোয়েস্ট পাঠানো হয়েছে ✅");loadHist()}catch(e){toast("ব্যর্থ, আবার চেষ্টা করুন")}};
async function loadHist(){const s=await getDocs(query(collection(db,"withdrawals"),where("uid","==",uid)));const L=s.docs.map(d=>d.data()).sort((a,b)=>b.createdAt-a.createdAt);
 $("hist").innerHTML=L.length?L.map(w=>`<div class="row"><span>${w.method} • ৳${w.taka}</span><span>${{pending:"⏳ অপেক্ষমাণ",paid:"✅ পরিশোধিত",rejected:"❌ বাতিল"}[w.status]}</span></div>`).join(""):"—"}
</script></body></html>
